function renderSetup(e){const issues=validate(e);return `<section class="page active"><div class="heading"><div><h2>Exam Setup</h2><p>Exam details, room setup and reusable room selection.</p></div><div class="tools"><button class="btn primary" id="addRoomBtn">＋ Add room</button><button class="btn" id="cloneBtn">Clone exam</button></div></div>${issues.length?`<div class="validation"><b>Setup needs attention</b><ul>${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<section class="card"><div class="cardHead"><div class="sectionTitle"><span class="sectionNo">01</span><div><h3>Exam details</h3><div class="small muted">Date and time can be typed or selected.</div></div></div></div><div class="formGrid"><div class="field span3"><label>Course code</label><input id="courseCode" value="${esc(e.details.courseCode)}" autocomplete="off"></div><div class="field span6"><label>Course name</label><input id="courseName" value="${esc(e.details.courseName)}"></div><div class="field span3"><label>Term</label><input id="term" value="${esc(e.details.term)}"></div><div class="field span3"><label>Exam date</label><div style="display:flex;gap:5px"><input id="examDate" placeholder="dd/mm/yyyy" value="${esc(e.details.date)}"><input id="datePicker" type="date" value="${dateIso(e.details.date)}" style="width:42px;padding:0 5px;background:#fff" aria-label="Choose exam date"></div></div><div class="field span2"><label>Normal start</label><input id="normalStart" type="time" value="${esc(e.details.normalStart)}"></div><div class="field span2"><label>Normal end</label><input id="normalEnd" type="time" value="${esc(e.details.normalEnd)}"></div><div class="field span2"><label>SEN start</label><input id="senStart" type="time" value="${esc(e.details.senStart)}"></div><div class="field span2"><label>SEN end</label><input id="senEnd" type="time" value="${esc(e.details.senEnd)}"></div></div></section><section class="card"><div class="cardHead"><div class="sectionTitle"><span class="sectionNo">0 function renderRoomRow(r,i,e){const used=new Set(e.rooms.filter(x=>x.id!==r.id&&x.sourceRoomId).map(x=>x.sourceRoomId));const opts=state.roomCatalog.filter(x=>x.active&&(x.id===r.sourceRoomId||!used.has(x.id)));return `<div class="roomRow" data-room="${r.id}"><div class="roomIndex">${String(i+1).padStart(2,'0')}</div><div class="field"><label>Room Name / Number</label><input class="roomName" list="roomOpts-${r.id}" value="${esc(r.name)}" ${e.locked?'disabled':''}><datalist id="roomOpts-${r.id}">${opts.map(x=>`<option value="${esc(x.name)}">${x.capacity} seats · ${x.digitalCapacity} digital · ${esc(x.senSuitability)}</option>`).join('')}</datalist><div class="roomErr" id="roomErr-${r.id}"></div></div><div class="field"><label>Address</label><input class="roomAddress" value="${esc(r.address)}" ${e.locked?'disabled':''}></div><div class="field"><label>Seats</label><input class="roomCap" type="number" min="0" value="${Number(r.capacity||0)}" ${e.locked?'disabled':''}></div><div class="field"><label>DigiExam</label><input class="roomDig" type="number" min="0" max="${Number(r.capacity||0)}" value="${Number(r.digitalCapacity||0)}" ${e.locked?'disabled':''}></div><div class="field"><label>SEN suitability</label><select class="roomSen" ${e.locked?'disabled':''}><option ${r.senSuitability==='Standard Only'?'selected':''}>Standard Only</option><option ${r.senSuitability==='SEN Only'?'selected':''}>SEN Only</option><option ${r.senSuitability==='Mixed / Isolated Bay'?'selected':''}>Mixed / Isolated Bay</option><option ${r.senSuitability==='Private Room'?'selected':''}>Private Room</option></select></div><div class="field"><label>Invigilators</label><input class="roomInv" type="number" min="0" value="${Number(r.invigilatorsRequired||0)}" ${e.locked?'disabled':''}></div><button class="btn icon danger" data-remove-room="${r.id}" ${e.locked?'disabled':''}>×</button><div class="field full"><label>Facilities / notes</label><input class="roomFacilities" value="${esc(r.facilities||'')}$ }

function renderGridPage(kind,title,desc,cols){const config=kind==='students'?{data:exam().students,key:'students'}:kind==='inv'?{data:state.invigilators,key:'inv'}:{data:state.roomCatalog,key:'rooms'};const data=config.data;const filters=filterState[config.key];const all=(filters._all||'').trim().toLowerCase();let indices=data.map((_,i)=>i).filter(i=>{if(all){const hay=Object.keys(data[i]||{}).map(k=>cellValue(config.key,data[i],k)).join(' ').toLowerCase();if(!hay.includes(all))return false}return Object.entries(filters).filter(([k])=>k!=='_all').every(([k,v])=>!v||String(cellValue(config.key,data[i],k)).toLowerCase().includes(v.toLowerCase()))});const s=sortState[config.key];if(s){indices.sort((a,b)=>compare(cellValue(config.key,data[a],s.key),cellValue(config.key,data[b],s.key))*(s.dir||1))}return `<section class="page active"><div class="heading"><div><h2>${title}</h2><p>${desc}</p></div><div class="tools"><button class="btn" data-email-all="${config.key}">${kind==='students'?'✉ Email all students':'✉ Email list'}</button></div></div><div class="card"><div class="toolbar sheetActionToolbar"><input class="search sheetTopSearch" id="${config.key}SearchTop" placeholder="⌕  Search ${kind==='rooms'?'room data':kind==='students'?'students':'invigilators'}" value="${esc((filterState[config.key]._all)||'')}"><button class="btn sm" data-import="${config.key}">⇧ Import</button><div class="exportWrap"><button class="btn sm exportToggle" data-export-menu="${config.key}">⇩ Export⌄</button><div class="exportMenu" data-export-menu-panel="${config.key}"><button type="button" data-export="${config.key}" data-format="xlsx">Excel</button><button type="button" data-export="${config.key}" data-format="csv">CSV</button></div></div><button class="btn sm" data-print="${config.key}">🖨</button><button class="btn sm danger" data-grid="${config.key}" data-op="delete">▣ Delete</button><button class="btn sm primary" data-add-row="${config.key}">＋ Add</button><span class="muted small" style="margin-left:auto">Selected ${selectedRows[config.key].size} rows · ${selectedCols[config.key].size} columns</span></div><div class="toolbar"><button class="btn sm" data-grid="${config.key}" data-op="copy">Copy</button><button class="btn sm" data-grid="${config.key}" data-op="cut">Cut</button><button class="btn sm" data-grid="${config.key}" data-op="paste">Paste</button><button class="btn sm" data-grid="${config.key}" data-op="undo">Undo</button><button class="btn sm" data-grid="${config.key}" data-op="redo">Redo</button><button class="btn sm danger" data-grid="${config.key}" data-op="delete">Delete selected</button><button class="btn sm" data-grid="${config.key}" data-op="clearrows">Clear rows</button><button class="btn sm" data-grid="${config.key}" data-op="clearcols">Clear columns</button><span class="muted small" style="margin-left:6px">Selected ${selectedRows[config.key].size} rows · ${selectedCols[config.key].size} columns</span><input class="search grow" id="${config.key}Search" placeholder="Search" value="${esc((filterState[config.key]._all)||'')}"></div><div class="tableWrap"><table class="sheet"><thead><tr><th class="si selectable-header" data-select-all="${config.key}" title="Click to select all visible rows">SI</th>${cols.map(([k,label])=>`<th class="${selectedCols[config.key].has(k)?'column-selected':''}" data-select-col="${config.key}" data-col-key="${esc(k)}" title="Click column header to select column"><span class="selectable-col-label">${esc(label)}</span><button class="sortButton" data-sort="${config.key}" data-key="${k}" title="Sort by ${esc(label)}">${sortState[config.key]?.key===k?(sortState[config.key].dir===1?'↑':'↓'):'↕'}</button></th>`) .join('')}</tr><tr class="filter"><th></th>${cols.map(([k])=>`<th><input class="filterInput" data-filter="${config.key}" data-key="${k}" value="${esc(filters[k]||'')}" placeholder="Filter"></th>`).join('')}</tr></thead><tbody>${indices.map((idx,displayIndex)=>renderGridRow(config.key,data[idx],idx,displayIndex, function cellValue(kind,row,k){if(kind==='students'){if(k==='sen')return (row.sen||[]).join(', ');if(k==='digital'||k==='attendance')return row[k]?'Yes':'No';if(k==='roomId')return exam().rooms.find(r=>r.id===row.roomId)?.name||'';if(k==='idChecks')return (row.idChecks||[]).filter(Boolean).length+'/3';if(k==='deskNumber')return row.deskNumber??'';return row[k]??''}if(kind==='inv'){if(k==='senQualified'||k==='active')return row[k]?'Yes':'No';if(k==='roomId')return exam().rooms.find(r=>r.id===row.roomId)?.name||'';return row[k]??''}return row[k]??''}
function renderGridRow(kind,row,idx,displayIndex,cols){
  const sel=selectedRows[kind].has(row.id); let cells=''; const rowClass=sel?' class="row-selected"':'';
  if(kind==='students'){
    cells+=`<td class="si selectable-row" data-select-row="${kind}" data-id="${row.id}">${displayIndex+1}</td>`;
    cells+=`<td><input class="cell" data-edit="students" data-id="${row.id}" data-key="registrationNumber" value="${esc(row.registrationNumber)}"></td>`;
    cells+=`<td><input class="cell" data-edit="students" data-id="${row.id}" data-key="firstName" value="${esc(row.firstName)}"></td>`;
    cells+=`<td><input class="cell" data-edit="students" data-id="${row.id}" data-key="lastName" value="${esc(row.lastName)}"></td>`;
    cells+=`<td><div style="display:flex;gap:5px;align-items:center"><input class="cell" style="min-width:190px" data-edit="students" data-id="${row.id}" data-key="email" value="${esc(row.email)}"><button class="emailBtn" data-email-one="student:${row.id}" title="Open email draft">✉</button></div></td>`;
    cells+=`<td><details class="senPicker"><summary title="Choose multiple SEN accommodations">${esc((row.sen||[]).join('; ')||'None — select accommodations')}</summary><div class="senChoices">${[...new Set([...SEN_OPTIONS,...(row.sen||[])])].map(v=>`<label><input type="checkbox" data-sen-option="${row.id}" value="${esc(v)}" ${(row.sen||[]).includes(v)?'checked':''}> ${esc(v)}</label>`).join('')}<div class="senCustom"><input type="text" placeholder="Add another accommodation" data-sen-new="${row.id}"><button type="button" class="btn sm" data-sen-add="${row.id}">Add</button></div></div></details></td>`;
    cells+=`<td><input class="tickBox" type="checkbox" data-edit-check="students" data-id="${row.id}" data-key="digital" ${row.digital?'checked':''} aria-label="DigiExam"></td>`;
    cells+=`<td>${esc(row.allocationStatus)}${row.digital?' '+digitalMark(row):''}</td>`;
    cells+=`<td>${esc(exam().rooms.find(r=>r.id===row.roomId)?.name||'')}</td>`;
    cells+=`<td>${row.deskNumber??''}</td>`;
    cells+=`<td><input class="tickBox" type="checkbox" data-edit-check="students" data-id="${row.id}" data-key="attendance" ${row.attendance?'checked':''} aria-label="Attendance"></td>`;
    cells+=`<td>${[0,1,2].map(n=>`<label class="listCheck" style="display:inline-flex;margin-right:4px"><input type="checkbox" data-idcheck="${row.id}" data-n="${n}" ${row.idChecks?.[n]?'checked':''}>${n+1}</label>`).join('')}</td>`;
  } else if(kind==='inv'){
    cells+=`<td class="si selectable-row" data-select-row="${kind}" data-id="${row.id}">${displayIndex+1}</td>`;
    for(const [k] of cols){
      const v=cellValue(kind,row,k);
      if(['senQualified','active'].includes(k)) cells+=`<td><input class="tickBox" type="checkbox" data-edit-check="inv" data-id="${row.id}" data-key="${k}" ${row[k]?'checked':''} aria-label="${esc(k)}"></td>`;
      else if(k==='roomId') cells+=`<td>${esc(v)}</td>`;
      else cells+=`<td><input class="cell" data-edit="inv" data-id="${row.id}" data-key="${k}" value="${esc(v)}"></td>`;
    }
  } else {
    cells+=`<td class="si selectable-row" data-select-row="rooms" data-id="${row.id}">${displayIndex+1}</td>`;
    for(const [k] of cols){
      if(k==='active') cells+=`<td><select class="cell" data-edit-select="rooms" data-id="${row.id}" data-key="active"><option value="true" ${row.active?'selected':''}>Yes</option><option value="false" ${!row.active?'selected':''}>No</option></select></td>`;
      else cells+=`<td><input class="cell" data-edit="rooms" data-id="${row.id}" data-key="${k}" value="${esc(row[k])}"></td>`;
    }
  }
  return `<tr${rowClass}>${cells}</tr>`;
}

function addRoom(catalogId){const e=exam();if(e.locked)return toast('Unlock the exam before adding rooms',true);const used=new Set(e.rooms.map(r=>r.sourceRoomId));const src=catalogId?state.roomCatalog.find(r=>r.id===catalogId):state.roomCatalog.find(r=>r.active&&!used.has(r.id));const r=src?{...clone(src),id:uid('configured-room'),sourceRoomId:src.id,senSuitability:'Standard Only',senSeatLimit:0,invigilatorsRequired:2,deskPrefix:'Desk ',deskStart:1,notes:''}:{id:uid('configured-room'),name:'New room',publicName:'Exam Hall',address:'',capacity:1,digitalCapacity:0,facilities:'',senSuitability:'Standard Only',active:true,invigilatorsRequired:1,deskPrefix:'Desk ',deskStart:1,notes:''};e.rooms.push(r);touch();render()}
function removeRoom(id){const e=exam();if(e.locked)return toast('Unlock the exam before removing rooms',true);const r=e.rooms.find(x=>x.id===id);const has=e.students.some(s=>s.roomId===id);if(has&&!confirm(`${r?.name||'Room'} contains allocations. Remove it and unassign those students?`))return;e.students.forEach(s=>{if(s.roomId===id){s.roomId=null;s.deskNumber=null;s.allocationStatus='Unassigned'}});e.rooms=e.rooms.filter(x=>x.id!==id);state.invigilators.forEach(i=>{if(i.roomId===id)i.roomId=null});touch();render()}
function bindRoomRow(row){const id=row.dataset.room;row.querySelector('.roomName').onchange=()=>roomNameChange(id,row.querySelector('.roomName').value);row.querySelector('.roomName').onblur=()=>roomNameChange(id,row.querySelector('.roomName').value);for(const [sel,key] of [['roomAddress','address'],['roomCap','capacity'],['roomDig','digitalCapacity'],['roomSen','senSuitability'],['roomInv','invigilatorsRequired'],['roomFacilities','facilities'],['roomSenSeats','senSeatLimit']])(row.querySelector('.'+sel)||{oninput:null}).oninput=()=>{const r=exam().rooms.find(x=>x.id===id);let v=row.querySelector('.'+sel)?.value;if(v===undefined)return;if(['capacity','digitalCapacity','invigilatorsRequired','senSeatLimit'].includes(key))v=Number(v||0);r[key]=v;if(key==='capacity'&&r.digitalCapacity>r.capacity){r.digitalCapacity=r.capacity;row.querySelector('.roomDig').value=r.capacity}if(key==='senSeatLimit')r.senSeatLimit=Math.min(Math.max(0,Number(v)),Number(r.capacity||0));if(key==='senSuitability')render();touch(false)} }
function roomNameChange(id,val){const e=exam();const name=val.trim();const r=e.rooms.find(x=>x.id===id);const dup=e.rooms.some(x=>x.id!==id&&x.name.trim().toLowerCase()===name.toLowerCase());const err=document.getElementById('roomErr-'+id);if(!name){err.textContent='Enter or select a room.';return}if(dup){err.textContent='This room is already added to this exam.';return}const src=state.roomCatalog.find(x=>x.active&&x.name.trim().toLowerCase()===name.toLowerCase());if(src){Object.assign(r,{...clone(src),id,sourceRoomId:src.id,senSuitability:r.senSuitability||'Standard Only',senSeatLimit:r.senSeatLimit||0,invigilatorsRequired:r.invigilatorsRequired||2,deskPrefix:r.deskPrefix||'Desk ',deskStart:r.deskStart||1,notes:r.notes||''})}else{r.name=name;r.sourceRoomId=null}err.textContent='';touch(false);render()}
function validate(e){const a=[];if(!e.details.courseCode.trim())a.push('Course code is required.');if(!/^\d{2}\/\d{2}\/\d{4}$/.test(e.details.date))a.push('Exam date must use DD/MM/YYYY.');if(!e.details.normalStart||!e.details.normalEnd||e.details.normalEnd<=e.details.normalStart)a.push('Normal end time must be later than start time.');if(!e.details.senStart||!e.details.senEnd||e.details.senEnd<=e.details.senStart)a.push('SEN end time must be later than start time.');if(!e.rooms.length)a.push('Add at least one room before allocation.');e.rooms.forEach(r=>{if(Number(r.capacity)<=0)a.push(`${r.name} needs a positive seating capacity.`);if(Number(r.digitalCapacity)>Number(r.capacity))a.push(`${r.name} has more DigiExam seats than total seats.`);if(r.senSuitability==='Mixed / Isolated Bay'&&(!Number.isInteger(Number(r.senSeatLimit||0))||Number(r.senSeatLimit||0)<0||Number(r.senSeatLimit||0)>Number(r.capacity)))a.push(`${r.name}: SEN seats must be between 0 and total capacity.`);});const regs={};e.students.forEach(s=>{if(!s.registrationNumber.trim())return;regs[s.registrationNumber]=(regs[s.registrationNumber]||0)+1});const d=Object.entries(regs).filter(([,n])=>n>1).map(([r])=>r);if(d.length)a.push('Duplicate registration numbers: '+d.join(', '));return a}
function shuffle(arr,seed=Date.now()){return [...arr].sort((a,b)=>hash(a.id,seed)-hash(b.id,seed)||a.id.localeCompare(b.id))}function hash(v,seed){let h=seed|0;for(const c of v)h=((h<<5)-h+c.charCodeAt(0))|0;return h}

function renderKeepingFocus(id,cursor,kind,key){
 const el=id?document.getElementById(id):document.querySelector(`[data-filter="${kind}"][data-key="${key}"]`);
 const start=cursor??el?.selectionStart??null;
 render();
 const next=id?document.getElementById(id):document.querySelector(`[data-filter="${kind}"][data-key="${key}"]`);
 if(next){next.focus({preventScroll:true});if(start!==null&&next.setSelectionRange)next.setSelectionRange(start,start)}
}
function renumberRoomSeats(e){
 for(const room of e.rooms){
  const students=e.students.filter(s=>s.roomId===room.id);
  // Seat numbers are display sequence; DigiExam eligibility is validated separately.
  students.sort((a,b)=>(Number(a.deskNumber)||999999)-(Number(b.deskNumber)||999999)||String(a.registrationNumber).localeCompare(String(b.registrationNumber)));
  students.forEach((s,i)=>s.deskNumber=i+1);
 }
}
function roomEligibleForStudent(s,r){
 const type=r.senSuitability||'Standard Only';
 if(needsPrivate(s.sen))return type==='Private Room';
 if(type==='Private Room')return false;
 if(isSen(s))return type==='SEN Only'||(type==='Mixed / Isolated Bay'&&Number(r.senSeatLimit||0)>0);
 return type==='Standard Only'||type==='Mixed / Isolated Bay';
}
function senRoomLimitReached(student,room,occupants){
 return isSen(student)&&!needsPrivate(student.sen)&&room.senSuitability==='Mixed / Isolated Bay'&&occupants.filter(isSen).length>=Number(room.senSeatLimit||0);
}

function availableDesk(room,occupants,digital){const used=new Set(occupants.filter(s=>s.roomId===room.id).map(s=>Number(s.deskNumber)));for(let n=1;n<=Number(room.capacity||0);n++)if(!used.has(n))return n;return null}
function allocation(){const e=exam();if(e.locked)return toast('Unlock before allocating',true);const base=validate(e);if(base.length)return showIssues(base);for(const r of e.rooms)if(r.digitalCapacity>r.capacity)return showIssues([`${r.name}: DigiExam seats cannot exceed total seats.`]);let students=clone(e.students);students.forEach(s=>{s.roomId=null;s.deskNumber=null;s.allocationStatus='Unassigned'});const pending=shuffle(students).sort((a,b)=>tier(a)-tier(b));const issues=[];const reservedPrivateRooms=new Set();const emptyRooms=()=>e.rooms.filter(r=>!students.some(x=>x.roomId===r.id)&&!reservedPrivateRooms.has(r.id));for(const s of pending){const privateNeed=needsPrivate(s.sen);let elig=e.rooms.filter(r=>roomEligibleForStudent(s,r));if(privateNeed){elig=emptyRooms().filter(r=>r.senSuitability==='Private Room');}else{elig=elig.filter(r=>!students.some(x=>x.roomId===r.id&&needsPrivate(x.sen)));}let placed=false;for(const r of elig){const occ=students.filter(x=>x.roomId===r.id);if(privateNeed&&occ.length)continue;if(!privateNeed&&occ.some(x=>needsPrivate(x.sen)))continue;if(occ.length>=r.capacity||senRoomLimitReached(s,r,occ))continue;if(s.digital&&occ.filter(x=>x.digital).length>=r.digitalCapacity)continue;const desk=privateNeed?(r.deskStart||1):availableDesk(r,students,s.digital);if(desk==null)continue;s.roomId=r.id;s.deskNumber=desk;s.allocationStatus=privateNeed?'Private Room':'Allocated';if(privateNeed)reservedPrivateRooms.add(r.id);placed=true;break}if(!placed){s.allocationStatus='Capacity Conflict';issues.push(`${s.registrationNumber} ${s.firstName} ${s.lastName}: no suitable room/seat is available (check SEN bay limit, private room and DigiExam capacity).`)}}if(issues.length){e.students=students;renumberRoomSeats(e);e.locked=false;showIssues(issues);touch(false);render();return}allocateInvigilators();e.students=students;renumberRoomSeats(e);e.locked=true;touch();render();toast('Students allocated and exam locked')}
function tier(s){return needsPrivate(s.sen)?0:isSen(s)&&s.digital?1:isSen(s)?2:s.digital?3:4}
function allocateInvigilators(reshuffle=false){const e=exam();const list=clone(state.invigilators);if(reshuffle||true)list.forEach(i=>i.roomId=null);const free=shuffle(list.filter(i=>i.active));const rooms=[...e.rooms].sort((a,b)=>Number(b.senSuitability==='SEN Only')-Number(a.senSuitability==='SEN Only'));const issues=[];for(const r of rooms){const need=Number(r.invigilatorsRequired||0);let candidates=free.filter(i=>!i.roomId&&(r.senSuitability!=='SEN Only'||i.senQualified));let n=0;for(const i of candidates.slice(0,need)){i.roomId=r.id;n++}if(n<need)issues.push(`${r.name}: ${need-n} suitable invigilator(s) still required.`)}state.invigilators=list;return issues}

}

}

function renderImportWizard(auto=true){const c=importContext,sheet=currentImportSheet();if(!c||!sheet)return;const fields=IMPORT_FIELDS[c.kind], header=Math.max(1,Number(c.headerRow)||1),headers=(sheet.rows[header-1]||[]).map((v,i)=>cleanCell(v)||`Column ${i+1}`);const mappings=Object.fromEntries(fields.map(f=>{const i=colIndexByAlias(headers,[f[1],...(f[2]||[])]);return [f[0],i]}));c.headers=headers;c.mapping=c.mapping||mappings;const mode=c.kind==='students'?`<label class="field"><span>Import mode</span><select id="importMode"><option value="append">Add / update existing students</option><option value="replace">Replace current student register</option></select></label>`:'';openDialog(`<div class="dialogHead"><div><h3>Import ${c.kind==='students'?'Students':c.kind==='inv'?'Invigilators':'Room Data'}</h3><div class="small muted">${esc(c.fileName)} · choose the correct worksheet and header, then map the required fields.</div></div><button class="btn icon" data-close>×</button></div><div class="dialogBody"><div class="mapGrid"><label class="field"><span>Worksheet</span><select id="importSheet"><option value="0">CSV / Sheet</option>${c.sheets.map((x,i)=>`<option value="${i}" ${i===c.sheetIndex?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label class="field"><span>Header row</span><input id="importHeader" type="number" min="1" value="${header}"></label>${mode}</div><div class="mapGrid" id="importMappings">${fields.map(f=>`<label class="field"><span>${esc(f[1])}</span><select data-map-field="${f[0]}">${importFieldOptions(headers,c.mapping[f[0]]??-1)}</select></label>`).join('')}</div><div class="printWarning" style="margin:8px 0">Extra spreadsheet columns are allowed. Only the mapped columns below will be imported. The detected header row is only a suggestion and can be changed.</div><div id="importPreview" class="previewWrap"></div><div id="importErrors"></div></div><div class="dialogFoot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="confirmImport">Import</button></div>`);const refresh=()=>{const n=Math.max(1,Number(document.getElementById('importHeader').value)||1);c.headerRow=n;const sh=currentImportSheet();c.headers=(sh.rows[n-1]||[]).map((v,i)=>cleanCell(v)||`Column ${i+1}`);const map={};document.querySelectorAll('[data-map-field]').forEach(sel=>map[sel.dataset.mapField]=Number(sel.value));c.mapping=map;document.querySelectorAll('[data-map-field]').forEach(sel=>{const f=fields.find(x=>x[0]===sel.dataset.mapField);sel.innerHTML=importFieldOptions(c.headers,map[sel.dataset.mapField]);});renderImportPreview();};document.getElementById('importSheet').onchange=e=>{c.sheetIndex=Number(e.target.value);c.headerRow=detectedHeaderRow(currentImportSheet().rows,fields);renderImportWizard(true)};document.getElementById('importHeader').oninput=refresh;document.querySelectorAll('[data-map-field]').forEach(x=>x.onchange=()=>{c.mapping=c.mapping||{};c.mapping[x.dataset.mapField]=Number(x.value);renderImportPreview()});document.getElementById('confirmImport').onclick=confirmImport;renderImportPreview()}
function renderImportPreview(){const c=importContext,sh=currentImportSheet();if(!c||!sh)return;const h=c.headers||[];const rows=sh.rows.slice(Math.max(0,c.headerRow-1),Math.min(sh.rows.length,Math.max(0,c.headerRow-1)+8));const html=`<table class="preview"><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${h.map((_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;document.getElementById('importPreview').innerHTML=html;runImportValidation(false)}
function runImportValidation(show=true){const c=importContext,sh=currentImportSheet();if(!c||!sh)return[];const fields=IMPORT_FIELDS[c.kind],mapping=c.mapping||{},records=importRowsFromSheet(sh.rows,Math.max(1,c.headerRow)-1,mapping);const errors=[];if(c.kind==='students'){const reg=[];records.forEach((r,i)=>{if(!Object.values(r).some(v=>v))return;if(!cleanCell(r.registrationNumber))errors.push(`Row ${i+Math.max(2,c.headerRow)}: Registration Number is missing.`);else reg.push(cleanCell(r.registrationNumber).toLowerCase())});const seen=new Set();reg.forEach((v,i)=>{if(seen.has(v))errors.push(`Duplicate Registration Number in imported file: ${v}`);seen.add(v)});const existing=new Set(exam().students.map(s=>cleanCell(s.registrationNumber).toLowerCase()).filter(Boolean));if((document.getElementById('importMode')?.value||'append')==='append')records.forEach((r,i)=>{const n=cleanCell(r.registrationNumber).toLowerCase();if(n&&existing.has(n)&&records.slice(0,i).some(x=>cleanCell(x.registrationNumber).toLowerCase()===n))errors.push(`Duplicate with existing register at import row ${i+Math.max(2,c.headerRow)}: ${r.registrationNumber}`)})}if(c.kind==='rooms')records.forEach((r,i)=>{if(!Object.values(r).some(v=>v))return;const cap=Number(r.capacity||0),dig=Number(r.digitalCapacity||0);if(!r.name)errors.push(`Row ${i+Math.max(2,c.headerRow)}: Room Name / Number is missing.`);if(!(cap>0))errors.push(`Row ${i+Math.max(2,c.headerRow)}: Total Seats must be greater than zero.`);if(dig>cap)errors.push(`Row ${i+Math.max(2,c.headerRow)}: DigiExam Seats (${dig}) cannot exceed Total Seats (${cap}).`)});const host=document.getElementById('importErrors');if(host)host.innerHTML=errors.length?`<div class="validation"><b>Review before importing</b><ul>${errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:`<div class="validation" style="color:#11603f;background:#edf7f1;border-color:#c7dbc7"><b>No blocking import errors detected.</b> ${records.filter(r=>Object.values(r).some(v=>v)).length} data row(s) detected.</div>`;return errors}
function confirmImport(){const errors=runImportValidation(true);if(errors.length)return;const c=importContext,sh=currentImportSheet(),records=importRowsFromSheet(sh.rows,Math.max(1,c.headerRow)-1,c.mapping||{}).filter(r=>Object.values(r).some(v=>v));if(c.kind==='students'){const mode=document.getElementById('importMode')?.value||'append';if(mode==='replace'&&!confirm('Replace the current student register with this import?'))return;if(mode==='replace'){exam().students=[]}const byReg=new Map(exam().students.map(s=>[cleanCell(s.registrationNumber).toLowerCase(),s]));records.forEach(r=>{const key=cleanCell(r.registrationNumber).toLowerCase();let s=byReg.get(key);if(!s){s={id:uid('student'),registrationNumber:'',firstName:'',lastName:'',email:'',sen:[],digital:false,roomId:null,deskNumber:null,allocationStatus:'Unassigned',attendance:false,idChecks:[false,false,false]};exam().students.push(s);byReg.set(key,s)}s.registrationNumber=cleanCell(r.registrationNumber);s.firstName=cleanCell(r.firstName);s.lastName=cleanCell(r.lastName);s.email=cleanCell(r.email);if(cleanCell(r.sen))s.sen=normalizeSen(r.sen);if(cleanCell(r.digital))s.digital=/^(yes|true|1|y|x)$/i.test(cleanCell(r.digital))})}else if(c.kind==='inv'){const existing=new Map(state.invigilators.map(v=>[(cleanCell(v.email)||cleanCell(v.name)).toLowerCase(),v]));records.forEach(r=>{const key=(cleanCell(r.email)||cleanCell(r.name)).toLowerCase();let v=existing.get(key);if(!v){v={id:uid('inv'),name:'',email:'',contactNumber:'',role:'Assistant',senQualified:false,active:true,roomId:null};state.invigilators.push(v);existing.set(key,v)}v.name=cleanCell(r.name)||v.name;v.email=cleanCell(r.email)||v.email;v.contactNumber=cleanCell(r.contactNumber)||v.contactNumber;if(cleanCell(r.senQualified))v.senQualified=/^(yes|true|1|y|x)$/i.test(cleanCell(r.senQualified));if(cleanCell(r.active))v.active=!/^(no|false|0|n)$/i.test(cleanCell(r.active))})}else{const existing=new Map(state.roomCatalog.map(v=>[cleanCell(v.name).toLowerCase(),v]));records.forEach(r=>{const key=cleanCell(r.name).toLowerCase();let v=existing.get(key);if(!v){v={id:uid('room'),name:'',address:'',capacity:0,digitalCapacity:0,powerOutlets:'',facilities:'',senSuitability:'Standard Only',active:true,publicName:''};state.roomCatalog.push(v);existing.set(key,v)}v.name=cleanCell(r.name)||v.name;v.address=cleanCell(r.address);v.capacity=Math.max(0,Number(r.capacity||0));v.digitalCapacity=Math.min(Math.max(0,Number(r.digitalCapacity||0)),v.capacity);v.powerOutlets=cleanCell(r.powerOutlets);v.facilities=cleanCell(r.facilities);v.senSuitability=cleanCell(r.senSuitability)||'Standard Only';if(cleanCell(r.active))v.active=!/^(no|false|0|n)$/i.test(cleanCell(r.active));v.publicName=cleanCell(r.publicName)})}touch(false);closeDialog();render();toast(`${records.length} ${c.kind==='students'?'student':c.kind==='inv'?'invigilator':'room'} record(s) imported successfully.`);importContext=null}
function projectMenu(){const m=document.getElementById('projectDropdown');if(!m)return;const open=m.classList.toggle('open');document.getElementById('moreBtn')?.setAttribute('aria-expanded',open?'true':'false');}
function startNewExam(){const e=exam();if(e?.locked&&!confirm('This exam is locked. Start a new exam anyway?'))return;const x={id:uid('exam'),details:{courseCode:'',courseName:'Untitled Exam',term:'',date:'',normalStart:'09:00',normalEnd:'12:00',senStart:'09:00',senEnd:'12:00'},rooms:[],students:[],locked:false,archived:false,updatedAt:new Date().toISOString()};state.exams.push(x);state.activeExamId=x.id;state.activeTab='setup';save();render();}
function closeProjectDropdown(){const m=document.getElementById('projectDropdown');if(m){m.classList.remove('open');document.getElementById('moreBtn')?.setAttribute('aria-expanded','false')}}
function openAllocationPrintDialog(){const e=exam();if(!e.rooms.length)return toast('Add at least one exam room before printing.',true);const cols=[['seatNumber','Seat Number'],['registrationNumber','Registration Number'],['firstName','First Name'],['lastName','Last Name'],['email','Email'],['sen','SEN'],['digital','DigiExam'],['attendance','Attendance'],['idCheck','ID Check'],['room','Room']];openDialog(`<div class="dialogHead"><div><h3>Print room allocations</h3><div class="small muted">All configured rooms will be combined into one print/PDF. Each room starts on a separate page. Only the columns you select will appear in the student table.</div></div><button class="btn icon" data-close>×</button></div><div class="dialogBody printChooser"><div class="printOptions" id="printColumnOptions">${cols.map(([k,label])=>`<label class="printOption"><input type="checkbox" data-print-col="${k}" checked>${esc(label)}</label>`).join('')}</div><div class="printWarning" id="printOrientationWarning">Select the columns you want in the printed student table.</div><div class="tools" style="margin-top:10px"><label class="printOption"><input type="radio" name="printOrientation" value="portrait" checked> Portrait</label><label class="printOption"><input type="radio" name="printOrientation" value="landscape"> Landscape</label></div><div class="printPreview" id="printPreview"></div></div><div class="dialogFoot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="confirmAllocationPrint">Print allocation</button></div>`);const updatePreview=()=>{const chosen=Array.from(document.querySelectorAll('[data-print-col]:checked')).map(x=>x.dataset.printCol);const warn=document.getElementById('printOrientationWarning');if(warn)warn.innerHTML=chosen.length>4?`You selected <b>${chosen.length} columns</b>. Landscape is recommended to fit the selected columns on A4.`:`You selected <b>${chosen.length} column${chosen.length===1?'':'s'}</b>. Portrait should fit the selected columns.`;const headers=cols.filter(c=>chosen.includes(c[0]));let html='';e.rooms.forEach(r=>{const st=e.students.filter(s=>s.roomId===r.id).sort((a,b)=>(a.deskNumber??0)-(b.deskNumber??0)).slice(0,5);html+=`<div style="padding:7px 8px;border-bottom:1px solid var(--line);font-weight:800">${esc(r.name)}</div><table><thead><tr>${headers.map(h=>`<th>${esc(h[1])}</th>`).join('')}</tr></thead><tbody>${st.map(s=>`<tr>${headers.map(([k])=>`<td>${esc(printCellValue(s,r,k))}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${Math.max(1,headers.length)}">No allocated students</td></tr>`}</tbody></table>`});document.getElementById('printPreview').innerHTML=html||'<div class="empty">No rooms configured.</div>'};document.querySelectorAll('[data-print-col]').forEach(x=>x.onchange=updatePreview);updatePreview();document.getElementById('confirmAllocationPrint').onclick=()=>{const chosen=Array.from(document.querySelectorAll('[data-print-col]:checked')).map(x=>x.dataset.printCol);if(!chosen.length)return toast('Select at least one column.',true);const orient=document.querySelector('input[name="printOrientation"]:checked')?.value||'portrait';performAllocationPrint(chosen,orient);closeDialog()}}
function printCellValue(s,r,k){if(k==='seatNumber')return s.deskNumber??'';if(k==='registrationNumber')return s.registrationNumber||'';if(k==='firstName')return s.firstName||'';if(k==='lastName')return s.lastName||'';if(k==='email')return s.email||'';if(k==='sen')return (s.sen||[]).join(', ');if(k==='digital')return s.digital?'✓':'';if(k==='attendance')return s.attendance?'✓':'';if(k==='idCheck')return (s.idChecks||[]).filter(Boolean).length+'/3';if(k==='room')return r?.name||'';return ''}
function printCellHtml(s,r,k){if(k==='idCheck'){const checks=s.idChecks||[];return '<span class=\"id-checks\">'+[0,1,2].map(i=>'<span class=\"id-check '+(checks[i]?'checked':'')+'\"></span>').join('')+'</span>';}return esc(printCellValue(s,r,k));}
function performAllocationPrint(chosen,orient){const e=exam();const labels={seatNumber:'Seat Number',registrationNumber:'Registration Number',firstName:'First Name',lastName:'Last Name',email:'Email',sen:'SEN',digital:'DigiExam',attendance:'Attendance',idCheck:'ID Check',room:'Room'};const rooms=e.rooms.map((r,ri)=>{const st=e.students.filter(s=>s.roomId===r.id).sort((a,b)=>(a.deskNumber??0)-(b.deskNumber??0));const inv=state.invigilators.filter(v=>v.roomId===r.id);return `<section class="room"><div class="kicker">Exam Room Allocation</div><h1>${esc(e.details.courseCode)} — ${esc(e.details.courseName)}</h1><div class="meta"><span><b>Date:</b> ${esc(e.details.date)}</span><span><b>Normal:</b> ${esc(e.details.normalStart)}–${esc(e.details.normalEnd)}</span><span><b>SEN:</b> ${esc(e.details.senStart)}–${esc(e.details.senEnd)}</span><span><b>Room:</b> ${esc(r.name)}</span><span><b>Address:</b> ${esc(r.address)}</span><span><b>Capacity:</b> ${st.length} / ${esc(r.capacity)}</span></div><div class="inv"><b>Assigned invigilators:</b> ${esc(inv.map(v=>v.name+(v.email?' ('+v.email+')':'')).join(', ')||'—')}</div><table><thead><tr>${chosen.map(k=>`<th>${esc(labels[k])}</th>`).join('')}</tr></thead><tbody>${st.map(s=>`<tr>${chosen.map(k=>`<td>${printCellHtml(s,r,k)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${chosen.length}">No allocated students.</td></tr>`}</tbody></table></section>`}).join('');const w=window.open('','_blank','width=1200,height=900');if(!w){toast('The browser blocked the print window. Please allow pop-ups for this app.',true);return}const landscape=orient==='landscape';const css=`@page{size:A4 ${landscape?'landscape':'portrait'};margin:10mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}body{font-size:10pt}.room{break-after:page;page-break-after:always;min-height:calc(100vh - 20mm);padding:0}.room:last-child{break-after:auto;page-break-after:auto}.kicker{font-size:9pt;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.room h1{font-size:18pt;margin:2mm 0 3mm}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2mm 4mm;font-size:9pt;margin-bottom:3mm}.inv{font-size:9pt;margin:2mm 0 4mm}.room table{width:100%;border-collapse:collapse;table-layout:fixed}.room th,.room td{border:1px solid #555;padding:${landscape?'2mm 1.5mm':'3mm 2mm'};font-size:${landscape?'8pt':'9pt'};overflow-wrap:anywhere;vertical-align:top}.room th{background:#eee;color:#000;font-weight:700}.room td{background:#fff}.id-checks{display:inline-flex;align-items:center;justify-content:center;gap:2.5mm}.id-check{display:inline-flex;width:4.2mm;height:4.2mm;border:0.35mm solid #111;align-items:center;justify-content:center;font-size:3.2mm;line-height:1;font-weight:700}.id-check.checked::after{content:'✓';transform:translateY(-.2mm)}`;w.document.open();w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(e.details.courseCode||'Exam')} Allocation Print</title><style>${css}.digitalPower{display:inline-flex;align-items:center;justify-content:center;color:#1259a0;background:#e7f1ff;border:1px solid #b7d4f5;border-radius:5px;padding:1px 4px;margin-left:4px;font-size:13px;font-weight:900}.pill.private{background:#ffd6d3!important;border:2px solid #c92b25!important;color:#761c19!important}.pill.private .badge2{background:#bd241e!important;color:white!important}</style></head><body>${rooms}</body></html>`);w.document.close();w.focus();setTimeout(()=>{w.print();setTimeout(()=>w.close(),500)},250)}

document.addEventListener('click',e=>{if(e.target.closest('#moreBtn'))return;if(e.target.id==='menuBackupExcel'){closeProjectDropdown();exportBackupExcel();return}if(e.target.id==='menuBackupJson'){closeProjectDropdown();downloadText(JSON.stringify(state,null,2),'exam-allocation-backup.json','application/json');return}if(e.target.id==='menuOpenProject'){document.getElementById('restoreFile')?.click();return}if(e.target.id==='menuStart'){closeProjectDropdown();startNewExam();return}if(e.target.id==='menuClone'){closeProjectDropdown();cloneExam();return}if(e.target.id==='printAllocation'){openAllocationPrintDialog();return}if(e.target.id==='allocateBtn'){allocation();return}if(e.target.id==='reshuffleStudents'){reshuffleStudents();return}if(e.target.id==='reshuffleInv'){reshuffleInv();return}if(e.target.id==='cancelAllAllocations'){cancelAllAllocations();return}if(e.target.id==='lockBtn'){exam().locked=!exam().locked;touch();render();return}if(e.target.id==='roomEmail'){const r=exam().rooms.find(x=>x.id===state.activeTab.slice(5));openEmail(exam().students.filter(s=>s.roomId===r.id),r);return}if(e.target.closest('[data-room-export]')){const b=e.target.closest('[data-room-export]');const r=exam().rooms.find(x=>x.id===b.dataset.roomId);if(!r)return;const rows=exam().students.filter(s=>s.roomId===r.id).sort((a,b)=>(a.deskNumber??0)-(b.deskNumber??0)).map((s,i)=>({'SI':i+1,'Seat No':s.deskNumber,'Registration Number':s.registrationNumber,'First Name':s.firstName,'Last Name':s.lastName,'Email':s.email,'SEN':s.sen.join(', '),'DigiExam':s.digital?'Yes':'No'}));writeExport(rows,`${exam().details.courseCode||'exam'}-${r.name}`,b.dataset.roomExport);return}if(e.target.id==='roomPrint'){openAllocationPrintDialog();return}});
